name: NEREO · descarte

# Primera pieza de la vigilancia autónoma: cruza el feed contra los calendarios
# reales de lanzamientos (Launch Library 2) y de lluvias de meteoros (American
# Meteor Society), y refresca la caché en data/descarte/.
#
# No escribe todavía en data/recientes.json: de momento solo informa, para poder
# comparar su criterio con el de la tarea que hace el descarte a mano.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"          # a diario, 05:41 UTC
  push:
    branches: [main]
    paths:
      - "vigilancia/**"
      - ".github/workflows/vigilancia-descarte.yml"

permissions:
  contents: write

concurrency:
  group: nereo-descarte
  cancel-in-progress: false

jobs:
  descarte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vigilancia/requirements.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r vigilancia/requirements.txt pytest

      - name: Pruebas
        run: python -m pytest -q vigilancia/tests

      - name: Calendarios en vivo
        run: python -m vigilancia calendarios

      - name: Revisar el feed
        run: python -m vigilancia feed | tee /tmp/feed.txt

      - name: Resumen de la ejecución
        if: always()
        run: |
          {
            echo "### Descarte automático"
            echo
            echo '```'
            cat /tmp/feed.txt 2>/dev/null || echo "sin salida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar la caché
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/descarte
          if git diff --cached --quiet; then echo "Sin cambios en data/descarte"; exit 0; fi
          git commit -m "descarte: calendarios $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
