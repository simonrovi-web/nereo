name: Telar · investigar un nombre

# Encargo por issue: la página abre un issue con el formulario «Telar · nombre»
# y este flujo lo recoge, investiga con un modelo de pesos abiertos y escribe
# telar/data/registro.json, que es lo que lee el visor estático.
#
# El repositorio es público y cualquiera puede abrir un issue, así que el
# trabajo solo corre si quien lo abrió es el dueño o un colaborador.
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre completo de la figura pública"
        required: true
      pais:
        description: "País"
        required: false
        default: "Chile"
      rol:
        description: "Cargo o rol público, si lo sabes"
        required: false
      nota:
        description: "Qué buscar"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: telar-registro
  cancel-in-progress: false

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Un issue solo entra si lleva el título del formulario y lo abrió alguien
    # con permisos sobre el repositorio. Un desconocido no puede encargar fichas.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'Telar:') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telar/pipeline/requirements.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r telar/pipeline/requirements.txt

      - name: Levantar SearXNG
        # Metabuscador de código abierto, en esta misma máquina. Sin clave y sin
        # terceros. Se habilita la salida JSON, que viene apagada por defecto,
        # y se eligen motores que no suelen bloquear a una IP de centro de datos.
        run: |
          mkdir -p /tmp/searxng
          cat > /tmp/searxng/settings.yml <<'YML'
          use_default_settings: true
          server:
            secret_key: "telar-efimero-$RANDOM"
            limiter: false
            public_instance: false
          search:
            formats: [html, json]
            safe_search: 0
          engines:
            - name: google
              disabled: true
            - name: bing
              disabled: true
            - name: duckduckgo
              disabled: false
            - name: brave
              disabled: false
            - name: mojeek
              disabled: false
            - name: wikipedia
              disabled: false
            - name: wikidata
              disabled: false
          YML
          docker run -d --name searxng -p 8080:8080 \
            -v /tmp/searxng/settings.yml:/etc/searxng/settings.yml:ro \
            searxng/searxng:latest
          for i in $(seq 1 40); do
            curl -sf "http://127.0.0.1:8080/search?q=prueba&format=json" >/dev/null && break
            sleep 3
          done
          curl -sf "http://127.0.0.1:8080/search?q=prueba&format=json" >/dev/null \
            && echo "SearXNG responde JSON" \
            || echo "SearXNG no respondió; se seguirá solo con Wikipedia"

      - name: Leer el encargo
        id: encargo
        env:
          CUERPO: ${{ github.event.issue.body }}
          TITULO: ${{ github.event.issue.title }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os, re
          ev = os.environ.get("GITHUB_EVENT_NAME", "")
          if ev == "workflow_dispatch":
              import json, pathlib
              d = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["inputs"]
              nombre, pais, rol, nota = d.get("nombre",""), d.get("pais",""), d.get("rol",""), d.get("nota","")
          else:
              cuerpo = os.environ.get("CUERPO") or ""
              titulo = os.environ.get("TITULO") or ""
              def campo(etiqueta):
                  # El formulario de issue rinde "### Etiqueta\n\nvalor".
                  m = re.search(r"###\s*" + etiqueta + r"\s*\n+([^\n#]*)", cuerpo, re.I)
                  v = (m.group(1).strip() if m else "")
                  return "" if v in ("_No response_", "_Sin respuesta_") else v
              nombre = campo("Nombre") or titulo.split(":", 1)[-1].strip()
              pais, rol, nota = campo("Pa.s"), campo("Cargo"), campo("Qu. buscar")
          def limpia(s):
              return re.sub(r"[\r\n]+", " ", str(s or "")).strip()[:200]
          for k, v in (("TELAR_NOMBRE", nombre), ("TELAR_PAIS", pais),
                       ("TELAR_ROL", rol), ("TELAR_NOTA", nota)):
              print(f"{k}={limpia(v)}")
          PY

      - name: Investigar
        id: investigar
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELAR_MODELO: ${{ vars.TELAR_MODELO || 'openai/gpt-oss-120b' }}
        run: python telar/pipeline/investigar.py

      - name: Publicar el registro
        if: steps.investigar.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telar/data/registro.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "telar: ficha de ${TELAR_NOMBRE}"
          git pull --rebase --autostash origin main
          git push

      - name: Responder en el issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RES: ${{ steps.investigar.outcome }}
        run: |
          if [ "$RES" = "success" ]; then
            MSG="Ficha de **${TELAR_NOMBRE}** escrita en \`telar/data/registro.json\`. Aparecerá en el visor cuando GitHub Pages publique el commit. Revísala: cada vínculo lleva la URL de la página de la que se extrajo."
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "$MSG"
          else
            MSG="No se abrió ficha para **${TELAR_NOMBRE}**. O no se confirmó un rol público con fuentes suficientes, o la búsqueda no devolvió páginas utilizables. El detalle está en el registro de la ejecución."
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$MSG"
          fi

      - name: Apagar SearXNG
        if: always()
        run: docker rm -f searxng 2>/dev/null || true
