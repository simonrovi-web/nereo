name: NEREO · inteligencia

# Corre la capa analítica (scikit-learn, h3, prophet, sentence-transformers) y la
# capa interpretativa (Ollama + gemma4:e4b en CPU), y publica data/ia/*.json.
on:
  schedule:
    - cron: "23 9 * * 1"          # lunes 09:23 UTC (06:23 en Chile continental en verano)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ia/**"
      - "data/points.bin.gz"
      - "data/points-meta.json"
      - ".github/workflows/ia.yml"

permissions:
  contents: write

concurrency:
  group: nereo-ia
  cancel-in-progress: false

env:
  OLLAMA_MODELS: ${{ github.workspace }}/.ollama-modelos
  NEREO_OLLAMA_MODELO: gemma4:e4b
  NEREO_OLLAMA_TIMEOUT: "1800"

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ia/requirements.txt
            ia/requirements-texto.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r ia/requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ia/requirements-texto.txt pytest

      - name: Pruebas
        working-directory: ia
        run: python -m pytest -q

      - name: Caché de modelos (Hugging Face y Ollama)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .ollama-modelos
          key: modelos-${{ env.NEREO_OLLAMA_MODELO }}-v1

      - name: Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$NEREO_OLLAMA_MODELO"

      - name: Análisis y redacción
        working-directory: ia
        run: python -m nereo_ia todo

      - name: Resumen de la ejecución
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/ia/resumen.json")
          if not p.exists():
              print("Sin resumen generado."); raise SystemExit
          r = json.loads(p.read_text())
          v = r["verificacion"]
          print(f"### {r['titular']}\n")
          print(f"Motor: **{r['motor']}** {r.get('modelo') or ''} · cifras verificadas {v['verificadas']}/{v['cifras']}\n")
          print(r["resumen"])
          if v["no_verificadas"]:
              print(f"\n**Cifras no verificadas:** {', '.join(v['no_verificadas'])}")
          PY

      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ia
          if git diff --cached --quiet; then echo "Sin cambios en data/ia"; exit 0; fi
          git commit -m "ia: análisis $(date -u +%F)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
