name: Telar · encargar un nombre
description: Pide la ficha de influencia de una figura pública. El flujo la investiga y la escribe en el registro.
title: "Telar: "
labels: ["telar"]
body:
  - type: markdown
    attributes:
      value: |
        Telar solo admite **figuras públicas**: personas con un rol público y rastro en registros públicos.
        Un particular sin rol público no tiene ficha, y el flujo la rechazará.

        La investigación la hace un modelo de pesos abiertos leyendo páginas reales.
        Cada vínculo queda con la URL de la página de la que salió; lo que no tenga respaldo se descarta.
  - type: input
    id: nombre
    attributes:
      label: Nombre
      description: Nombre completo, como aparecería en un registro público.
      placeholder: Sebastián Piñera Echenique
    validations:
      required: true
  - type: input
    id: pais
    attributes:
      label: País
      description: Sirve para ubicar la ficha en el mapamundi.
      value: Chile
    validations:
      required: false
  - type: input
    id: cargo
    attributes:
      label: Cargo o rol público
      description: Si lo sabes. Ayuda a no confundirla con otra persona del mismo nombre.
      placeholder: Expresidente de la República
    validations:
      required: false
  - type: textarea
    id: buscar
    attributes:
      label: Qué buscar
      description: Qué te interesa de esta persona.
      placeholder: Sus directorios, sus aportes de campaña, con quién comparte sociedades.
    validations:
      required: false
