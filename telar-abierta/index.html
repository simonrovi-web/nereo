<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telar se mudó</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://simonrovi-web.github.io/telar/?taller"><meta http-equiv="refresh" content="3;url=https://simonrovi-web.github.io/telar/?taller">
<script>
(async function(){
  try{
    var rs=await navigator.serviceWorker.getRegistrations();
    for(var r of rs) if(new URL(r.scope).pathname.startsWith("/nereo/telar")) await r.unregister();
  }catch(e){}
  location.replace("https://simonrovi-web.github.io/telar/?taller"+location.hash);
})();
</script></head>
<body style="font:16px system-ui;background:#04070c;color:#cfe6ee;padding:2rem">
<p>Telar ahora vive en <a style="color:#34dfe8" href="https://simonrovi-web.github.io/telar/?taller">https://simonrovi-web.github.io/telar/?taller</a>.</p></body></html>
